version: 2

models:
  - name: events
    description: >
      Одна подія = один рядок (grain — event_id). Дублікати за event_id прибрано,
      тестовий трафік (source = 'loadtest') і рядки без occurred_at / ride_id відкинуто.
      Incremental за `_ingested_at`.
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: event_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ride_requested
                  - ride_accepted
                  - ride_started
                  - ride_completed
                  - ride_cancelled
                  - payment_captured
      - name: ride_id
        data_tests:
          - not_null
      - name: source
        description: "Хто надіслав подію. `loadtest` у Silver потрапити не може."
        data_tests:
          - accepted_values:
              arguments:
                values: [rider_app, driver_app, billing]
      - name: occurred_at
        data_tests:
          - not_null
      - name: occurred_date
        description: "Календарна дата події за UTC."
        data_tests:
          - not_null
      - name: payload
        description: "Розібраний JSON події (jsonb)."
        data_tests:
          - not_null
      - name: _ingested_at
        data_tests:
          - not_null

  - name: rides
    description: >
      Одна поїздка = один рядок (grain — ride_id). Життєвий цикл із шести типів подій згорнуто
      в один рядок; поїздка з'являється, коли прийшла її ride_requested.
      Incremental за зачепленими ключами: перебудовуємо поїздки, яких торкнулися нові події.
    columns:
      - name: ride_id
        data_tests:
          - unique
          - not_null
      - name: requested_at
        data_tests:
          - not_null
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [requested, accepted, in_progress, completed, cancelled]
      - name: payment_method
        data_tests:
          - accepted_values:
              arguments:
                values: [card, cash, wallet]
      - name: _ingested_at
        data_tests:
          - not_null
