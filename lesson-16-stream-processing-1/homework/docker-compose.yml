# Один Kafka broker у KRaft-режимі (без Zookeeper, без Schema Registry, без UI).
# Мінімальний стек: усе, що потрібно для домашнього завдання L16, — це брокер на :9092.
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: hw16-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Тримаємо heap малим: Docker Desktop часто має лише ~2 GB.
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    healthcheck:
      # Дешева TCP-перевірка через nc (без запуску окремої JVM на кожен healthcheck).
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
