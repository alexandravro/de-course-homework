[project]
name = "lesson-17-homework"
version = "0.1.0"
description = "L17 homework — Spark Structured Streaming over GitHub Archive events"
requires-python = "==3.12.*"
dependencies = [
  "pyspark>=4.1.1",
  "pandas>=2.2,<3",  # pandas-on-Spark (pyspark 4.1) is incompatible with pandas 3.0
